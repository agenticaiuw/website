# Builds the website with the hub's text and deploys it to Cloudflare Pages.
# Runs when website/ changes on main, when the hub's text changes (the hub starts it),
# each night (so llms.txt and the events page split upcoming from past by the new date),
# or by hand from the Actions tab.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'

# One deploy at a time; a run that starts while one is going waits, and only the newest waits.
concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Saves the hub's current text first; stops here if the hub can't be reached.
      - run: npm run build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy build --project-name agenticaiuw --branch main --commit-dirty=true
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Built but not deployed. Add a CLOUDFLARE_API_TOKEN repository secret to deploy."
