name: TheHub
options:
  bundleIdPrefix: com.evanliu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9684Z8GZ26
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  TheHub:
    type: application
    platform: iOS
    sources:
      - path: TheHub
    info:
      path: TheHub/Info.plist
      properties:
        CFBundleDisplayName: The Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSRemindersFullAccessUsageDescription: The Hub adds your club tasks to Reminders, and marks them done in the hub when you check them off.
        NSCalendarsFullAccessUsageDescription: The Hub adds your club meetings and events to Calendar and keeps them up to date.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.evanliu.thehub.refresh]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evanliu.thehub
        TARGETED_DEVICE_FAMILY: "1"
