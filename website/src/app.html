<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/favicon-96.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta property="og:site_name" content="Agentic AI UW" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="%sveltekit.assets%/fonts/fonts.css" rel="stylesheet" />
		<script>
			// Set theme before first paint so there is no flash.
			try {
				const saved = localStorage.getItem('theme');
				document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
			} catch (e) {}
			document.documentElement.classList.add('js');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
